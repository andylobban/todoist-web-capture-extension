<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todoist Web Capture Extension</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <section id="loading-view" class="stack">
        <p class="body">Loading…</p>
      </section>

      <section id="signed-out-view" class="stack" hidden>
        <p class="body">Sign in with Todoist to save the current page.</p>
        <button id="sign-in" class="primary" type="button">Sign in with Todoist</button>
      </section>

      <section id="signed-in-view" class="stack" hidden>
        <form id="capture-form" class="stack">
          <label class="field">
            <span>Task title</span>
            <input id="task-title" name="title" type="text" maxlength="500" required>
          </label>

          <label class="field">
            <span>Project</span>
            <input id="project-name" name="projectName" type="text" list="project-options" placeholder="Inbox">
            <datalist id="project-options"></datalist>
          </label>

          <label class="field">
            <span>Tags</span>
            <input id="labels-input" name="labels" type="text" list="label-options" placeholder="Comma-separated tags">
            <datalist id="label-options"></datalist>
          </label>

          <div class="row">
            <label class="field">
              <span>Due date</span>
              <input id="due-date" name="dueDate" type="date">
            </label>

            <label class="field">
              <span>Priority</span>
              <select id="priority" name="priority">
                <option value="">None</option>
                <option value="1">🔴 P1</option>
                <option value="2">🟠 P2</option>
                <option value="3">🔵 P3</option>
                <option value="4">⚪ P4</option>
              </select>
            </label>
          </div>

          <label class="field">
            <span>Description</span>
            <textarea id="description" name="description" rows="3" placeholder="Optional description"></textarea>
          </label>

          <p id="page-url" class="meta"></p>
          <button id="save-task" class="primary" type="submit">Save to Todoist</button>
        </form>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
