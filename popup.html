<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todoist Web Capture Extension</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="panel-header">
        <div>
          <p class="eyebrow">Todoist Web Capture Extension</p>
          <h1 id="panel-title">Save this page to Todoist</h1>
        </div>
        <button id="open-settings" class="ghost" type="button">Settings</button>
      </header>

      <section id="signed-out-view" class="stack">
        <p class="body">Sign in once, then click the extension any time to save the current page with the project, tags, and date you want.</p>
        <button id="sign-in" class="primary" type="button">Sign in with Todoist</button>
      </section>

      <section id="signed-in-view" class="stack" hidden>
        <form id="capture-form" class="stack">
          <label class="field">
            <span>Task title</span>
            <input id="task-title" name="title" type="text" maxlength="500" required>
          </label>

          <label class="field">
            <span>Project</span>
            <select id="project-id" name="projectId">
              <option value="">Inbox</option>
            </select>
          </label>

          <fieldset class="field">
            <legend>Tags</legend>
            <div id="labels-list" class="checkbox-list empty-state">No tags yet.</div>
          </fieldset>

          <div class="row">
            <label class="field">
              <span>Due date</span>
              <input id="due-date" name="dueDate" type="date">
            </label>

            <label class="field">
              <span>Priority</span>
              <select id="priority" name="priority">
                <option value="">None</option>
                <option value="4">P4</option>
                <option value="3">P3</option>
                <option value="2">P2</option>
                <option value="1">P1</option>
              </select>
            </label>
          </div>

          <label class="field">
            <span>Notes</span>
            <textarea id="description" name="description" rows="3" placeholder="Optional notes"></textarea>
          </label>

          <p id="page-url" class="meta"></p>
          <button id="save-task" class="primary" type="submit">Save to Todoist</button>
        </form>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
