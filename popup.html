<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todoist Better Extension</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <p class="eyebrow">Todoist Better Extension</p>
      <h1>Save pages to Todoist in one click</h1>
      <p class="body">Sign in once, then click the extension any time to send the current page straight to your Todoist inbox.</p>
      <button id="sign-in" class="primary">Sign in with Todoist</button>
      <button id="open-settings" class="secondary">Settings</button>
      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
